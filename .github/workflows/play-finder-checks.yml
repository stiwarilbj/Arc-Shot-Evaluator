name: Play Finder implementation checks
on:
  pull_request:
  push:
    branches: [codex/nba-clip-index]
    paths-ignore: [.github/workflows/nba-source-probe.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: python3 -m unittest discover -s tests/nba -v
      - run: pnpm build
        working-directory: frontend
      - run: node scripts/check-build-target.mjs local frontend/dist
      - run: pnpm build
        working-directory: frontend
        env:
          VITE_DEPLOY_TARGET: github-pages
      - run: node scripts/check-build-target.mjs hosted frontend/dist
